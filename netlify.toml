[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/analytics/*"
  to = "/.netlify/functions/analytics"
  status = 200

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
