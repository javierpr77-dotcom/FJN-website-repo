<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FJN Digital | Websites Premium que Convierten en Toda la Isla de Puerto Rico</title>
    <meta name="description" content="Desarrollamos websites estratégicos, e-commerce, sistemas de reservas y funnels de venta en todos los 78 pueblos de Puerto Rico, con prioridad en negocios de alto valor en Dorado, Guaynabo, San Juan, Palmas del Mar y toda la isla." />
    <meta name="author" content="FJN Digital Media" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#02040a" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Canonical Link -->
    <link rel="canonical" href="https://fjndigitalmedia.com/" />

    <!-- Geo Targeting for Puerto Rico -->
    <meta name="geo.region" content="PR" />
    <meta name="geo.placename" content="San Juan, Puerto Rico" />
    <meta name="geo.position" content="18.4655;-66.1180" />
    <meta name="ICBM" content="18.4655, -66.1180" />

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="FJN Digital Media" />
    <meta property="og:title" content="FJN Digital Media | Websites Premium que Convierten en Puerto Rico" />
    <meta property="og:description" content="Diseño web estratégico, tiendas online (e-commerce), páginas de reservas y marketing digital de alto rendimiento en Puerto Rico." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fjndigitalmedia.com/" />
    <meta property="og:image" content="https://fjndigitalmedia.com/logo.png" />
    <meta property="og:locale" content="es_PR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@fjndigitalmedia" />
    <meta name="twitter:creator" content="@fjndigitalmedia" />
    <meta name="twitter:title" content="FJN Digital Media | Websites Premium que Convierten" />
    <meta name="twitter:description" content="Diseño web estratégico, tiendas online y sistemas de reservas en Puerto Rico." />
    <meta name="twitter:image" content="https://fjndigitalmedia.com/logo.png" />

    <!-- Resource Preconnects for High Performance & Core Web Vitals -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- Hidden Forms for Netlify Forms Crawler Detection on Single Page App -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="town" />
      <textarea name="goal"></textarea>
      <input type="text" name="date" />
      <input type="text" name="time" />
    </form>

    <form name="pricing-order" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="plan" />
      <input type="text" name="addons" />
      <input type="text" name="total" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
